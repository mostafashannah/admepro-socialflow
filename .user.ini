; Raises PHP's request body/upload limits above the common 8M/2M defaults —
; a PDF attached in Pro's chat is base64-encoded into the JSON POST body
; (~33% larger than the original file), so the default limits silently
; truncated the request for anything but the smallest PDFs, and ai-proxy.php
; would see an empty request body with no useful error. Only takes effect
; under PHP-FPM/CGI (honors .user.ini); if this server runs mod_php under
; Apache instead, the equivalent must be set in php.ini or the vhost config
; and Apache/PHP-FPM restarted.
post_max_size = 30M
upload_max_filesize = 30M
