# nginx site for the TEST subdomain. Copy to /etc/nginx/sites-available/new.admepro.com
# certbot --nginx -d new.admepro.com will add the HTTPS (443) block automatically.
server {
    listen 80;
    server_name new.admepro.com;
    root /var/www/new.admepro.com;
    index index.html;

    add_header X-Robots-Tag "noindex, nofollow" always;   # remove only for the real launch
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # 301s from the old WordPress URLs (generated by the build)
    include /etc/nginx/snippets/admepro-redirects.conf;

    location ~* \.(css|js|woff2|webp|png|jpg|mp4|svg)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location /ar/ { try_files $uri $uri/ $uri/index.html =404; error_page 404 /ar/404.html; }
    location / { try_files $uri $uri/ $uri/index.html =404; }
    error_page 404 /404.html;
}
