<style>
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; } /* stop phones/browsers inflating small text and breaking layouts */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;overflow-x:hidden}
body{font-family:"Montserrat",-apple-system,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;-webkit-tap-highlight-color:transparent}
input,select,textarea{font-family:inherit}
img{max-width:100%;display:block}

/* ── Accessibility: visible focus ring for keyboard users ── */
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent,#d90b2c)!important;outline-offset:2px;border-radius:4px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline-offset:0;border-radius:var(--rs,8px)}
.composer-textarea:focus-visible{outline:none!important}

/* ── Skip to main content link ── */
.skip-link{position:absolute;top:-100px;left:8px;z-index:9999;padding:10px 18px;background:var(--accent,#d90b2c);color:#fff;border-radius:6px;font-weight:700;font-size:14px;text-decoration:none;transition:top 0.1s}
.skip-link:focus{top:8px}

/* ── Minimum touch target size (44×44px WCAG 2.5.5) ── */
/* Applied via padding wrapper on interactive elements, not min-height overrides
   to avoid layout breakage. nav buttons already have minHeight:44 in JSX. */

/* ── Clickable card hover feedback ── */
[data-clickable]:hover{background:var(--surface2)!important;cursor:pointer}
[data-clickable]{transition:background 0.12s,transform 0.1s}

/* ── Better scrollbar ── */
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border2,rgba(255,255,255,0.15));border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:var(--text3,#888)}

/* ── Smooth page transitions ── */
.fade-in{animation:fadeIn 0.18s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ── Toast is announced by screen readers ── */
[role="status"]{aria-live:polite}
[role="alert"]{aria-live:assertive}

/* ── Looping marquee for overflowing chat titles ── */
@keyframes sfTitleScroll{
  0%,15%{transform:translateX(0)}
  85%,100%{transform:translateX(calc(-1 * var(--sf-scroll-dist, 0px)))}
}

<!-- Heavy tools (PDF/Excel/Word/zip/HEIC) load in the background AFTER the
     app is up, instead of blocking every page open. Code that needs one
     calls sfLib("name") which waits for it (and starts it if needed). -->
<script>
(function(){
  var L={
    html2pdf:"https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js",
    html2canvas:"https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js",
    mammoth:"https://cdn.jsdelivr.net/npm/mammoth@1.7.0/mammoth.browser.min.js",
    heic2any:"https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js",
    jspdf:"https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
    JSZip:"https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js",
    XLSX:"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
    pdfjsLib:"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"
  };
  var P={};
  function load(n){
    if(window[n]) return Promise.resolve(window[n]);
    if(P[n]) return P[n];
    P[n]=new Promise(function(res){
      var s=document.createElement("script"); s.src=L[n]; s.async=true;
      s.onload=function(){ if(n==="pdfjsLib"&&window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; } res(window[n]); };
      s.onerror=function(){ delete P[n]; res(undefined); };
      document.head.appendChild(s);
    });
    return P[n];
  }
  window.sfLib=function(n){ return L[n]?load(n):Promise.resolve(window[n]); };
  // Loaded only when a feature needs one (PDF, Excel, Word, zip, HEIC) — no background downloads competing with the app.
})();
</script>
<script src="/app.js?v=1665"></script>
